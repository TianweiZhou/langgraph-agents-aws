[project]
name = "langgraph-agents-aws"
version = "0.1.0"
description = "Multi-agent system on AWS: LangGraph on Lambda with Amazon Bedrock."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
infra = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "infra"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"
# LangGraph ships no stubs and has a few untyped internals; these only flag third-party gaps.
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
